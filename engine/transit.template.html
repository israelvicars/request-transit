<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit</title>
<!-- Transit: self-contained subway-map view of one trace. No network. Every frame is a pure
     function of t via window.renderAt(t): no Date.now, no timers, no randomness. -->
<style>
  /*__FONTS__*/
  html, body { margin: 0; background: #FFFFFF; }
  body { font-family: "Transit Sans", Arial, sans-serif; color: #111; }
  #stage { display: block; width: 1200px; height: 900px; }
  #controls { width: 1200px; box-sizing: border-box; padding: 10px 24px 8px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  #controls button { font: inherit; padding: 6px 14px; border: 2px solid #111; background: #fff; border-radius: 18px; cursor: pointer; min-width: 76px; font-weight: 700; }
  #controls input[type=range] { flex: 1; accent-color: #111; }
  #controls .t { font-variant-numeric: tabular-nums; min-width: 190px; text-align: right; color: #555; }
  #hops { width: 1200px; box-sizing: border-box; padding: 4px 24px 24px; font-size: 13px; }
  #hops table { border-collapse: collapse; width: 100%; }
  #hops td, #hops th { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; }
  .render #controls, .render #hops { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1200" height="900"></canvas>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0">
  <span class="t" id="tlabel"></span>
</div>
<div id="hops"></div>
<script>
/*__TRACE_DATA__*/
</script>
<script>
(function () {
'use strict';
const STAGE = window.STAGE = { width: 1200, height: 900 };
const FPS = 24;
// Design tokens: see references/design-system.md. Evokes the 1970s NYC system style without
// using any official route colour; every hex here is deliberately off the official palettes.
const C = {
  paper: '#FFFFFF', ink: '#111111', ink2: '#4A4A4A', ink3: '#9A9A9A', faint: '#E7E7E7',
  band: '#111111', bandInk: '#FFFFFF',
  slow: '#E89A00', slowInk: '#111111', err: '#D42A1E', infra: '#8C8C8C',
};
const LINE_COLORS = ['#2A62C9', '#1C8F5A', '#8B46C1', '#0B8A99', '#C23A7C', '#6F8A17', '#2C3F7E', '#9A5B26', '#4D7FA6', '#6A3B78', '#2F7A4C', '#B4572F'];
const F = { ui: '"Transit Sans", Arial, sans-serif' };
const font = (w, px) => `${w} ${px}px ${F.ui}`;
const INTRO = 0.75, OUTRO = 1.75;
const MIN_TRAVEL = 0.3;
const easeInOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
if (document.fonts && document.fonts.load) { document.fonts.load(font(400, 14)); document.fonts.load(font(700, 14)); }

// ------------------------------------------------------------------ model
const D = window.TRACE, OPT = window.VIZ_OPTS || {};
const spans = D.spans.map((s) => Object.assign({}, s, { end: s.start + s.duration }));
const byId = new Map(spans.map((s) => [s.spanId, s]));
const kids = new Map(spans.map((s) => [s.spanId, []]));
for (const s of spans) if (s.parentId && byId.has(s.parentId)) kids.get(s.parentId).push(s);

const root = spans.find((s) => !s.parentId) || spans[0];

// self time = duration minus the union of child intervals
for (const s of spans) {
  const iv = kids.get(s.spanId).map((c) => [Math.max(c.start, s.start), Math.min(c.end, s.end)]).filter((x) => x[1] > x[0]).sort((a, b) => a[0] - b[0]);

// nodes and calls
const nodes = new Map();

// pass 1: client/producer spans that talk to something uninstrumented (db, broker) -> inferred node

    const n = addNode(s.peer, !nodes.has(s.peer) || nodes.get(s.peer).inferred, s.start);

  const from = p.kind === 'producer' && p.via ? p.via : p.service;
  if (from === s.service) continue;

    c = { from, to: s.service, start: p.start, end: p.end, arrive: s.start, leave: s.end, span: p, callee: s, oneWay: false };
    if (s.start < p.start || s.end > p.end) { skewFixes++; c.arrive = clamp(c.arrive, c.start, c.end); c.leave = clamp(c.leave, c.arrive, c.end); }

  const slowS = sub.filter((x) => x.slow).sort((a, b) => a.slowAt - b.slowAt)[0];
  c.slow = !!slowS; c.slowAt = slowS ? slowS.slowAt : Infinity;
  const errS = [c.span, c.callee].filter((x) => x.status === 'error');   // this call failed (not just something below it)
  c.error = errS.length > 0; c.errorAt = c.error ? Math.min(...errS.map((x) => x.end)) : Infinity;

  c.outT = c.oneWay ? Math.min(MIN_LEG, Math.max(dur * 0.4, 0)) : Math.max(c.arrive - c.start, Math.min(MIN_LEG, dur * 0.4));

// node owner of each span (inferred peer spans belong to the peer node)
const nodeOf = (s) => s.via || s.service;

// ------------------------------------------------------------------ layout: layered left to right by longest call path
const out = new Map([...nodes.keys()].map((k) => [k, new Set()]));

}
const roots = [...nodes.keys()].filter((k) => indeg.get(k) === 0);
if (!roots.includes(root.service)) roots.unshift(root.service);
for (const r of roots) dfs(r, 0);
for (const k of nodes.keys()) if (!layer.has(k)) layer.set(k, 0);
const L = Math.max(...layer.values()) + 1;
const NODE_W = 40, NODE_H = 24;
const G = { top: 156, bottom: 556, left: 70, right: 1090 };
const colX = (i) => L === 1 ? (G.left + G.right) / 2 : G.left + NODE_W / 2 + i * (G.right - G.left - NODE_W) / (L - 1);

const MAX_GAP = 80;
for (let i = 0; i < L; i++) {
  const col = [...nodes.values()].filter((n) => layer.get(n.id) === i);
  const mid = (G.top + G.bottom) / 2;
  for (const n of col) {
    const ps = parentsOf(n.id).map((p) => nodes.get(p)).filter((p) => p.y != null);
    n.want = ps.length ? ps.reduce((a, p) => a + p.y, 0) / ps.length : mid;
  }
  col.sort((a, b) => a.want - b.want || a.first - b.first);
  const gap = Math.min(MAX_GAP, (G.bottom - G.top) / Math.max(1, col.length - 1));

  // inside the band. A column whose nodes all want the same spot is centred on that spot.
  const meanWant = col.reduce((a, n) => a + n.want, 0) / col.length;
  const spread = col.every((n) => Math.abs(n.want - col[0].want) < 1);
  col.forEach((n, j) => { n.y = spread ? meanWant + (j - (col.length - 1) / 2) * gap : n.want; });
  for (let j = 0; j < col.length; j++) col[j].y = Math.max(col[j].y, G.top, j ? col[j - 1].y + gap : -Infinity);
  for (let j = col.length - 1; j >= 0; j--) col[j].y = Math.min(col[j].y, G.bottom, j < col.length - 1 ? col[j + 1].y - gap : Infinity);
  for (let j = 0; j < col.length; j++) col[j].y = Math.max(col[j].y, G.top, j ? col[j - 1].y + gap : -Infinity);

}

const order = [...nodes.values()].sort((a, b) => a.layer - b.layer || a.y - b.y);

// edges
const edges = new Map();
for (const c of calls) {
  const k = c.from + '>' + c.to;
  if (!edges.has(k)) edges.set(k, { from: nodes.get(c.from), to: nodes.get(c.to), calls: [] });
  edges.get(k).calls.push(c);
}
// lanes: overlapping calls on the same edge get side-by-side tracks so fan-out reads as dots splitting
for (const e of edges.values()) {
  const lanesEnd = [];
  for (const c of e.calls.slice().sort((a, b) => a.start - b.start)) {
    let l = lanesEnd.findIndex((end) => end <= c.start);
    if (l < 0) { l = lanesEnd.length; lanesEnd.push(0); }
    lanesEnd[l] = c.end; c.lane = l;
  }

// ------------------------------------------------------------------ lines, bullets, geometry
const svcOrder = order.filter((n) => !n.inferred);
svcOrder.forEach((n, i) => { n.color = LINE_COLORS[i % LINE_COLORS.length]; n.bullet = i < 26 ? String.fromCharCode(65 + i) : String(i - 25); });

const SP = 10, LW = 7, H = 26, RAD = 14;
const laneOffset = (l) => (l === 0 ? 0 : (l % 2 ? 1 : -1) * Math.ceil(l / 2) * 13);

for (const e of edges.values()) { outE.get(e.from.id).push(e); inE.get(e.to.id).push(e); }

for (const n of order) {
  const o = [0, ...outE.get(n.id).map((e) => e.o1), ...inE.get(n.id).map((e) => e.o2)];
  n.top = Math.min(...o); n.bot = Math.max(...o);

}
const MAXY = Math.max(...order.map((n) => n.y + n.bot));

// rounded octilinear polyline, sampled so drawing and train motion use the same curve

function trainFor(c, tm) {

// ------------------------------------------------------------------ drawing
const cv = document.getElementById('stage');

function drawTrains(tm) {

// route strip map: the trip as one line in time order, like the strip above a subway car door
const hops = calls.slice().sort((a, b) => a.start - b.start || (a.to < b.to ? -1 : 1));
const SX0 = 70, SX1 = 1130, SY = 772;
const sx = (ms) => SX0 + (SX1 - SX0) * clamp(ms, 0, TOTAL) / TOTAL;
function drawStrip(tm) {
  ctx.fillStyle = '#F4F4F4'; ctx.fillRect(0, 690, STAGE.width, 150);
  ctx.fillStyle = C.ink; ctx.font = font(700, 12); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('THIS TRIP  ·  stops in time order', 40, 714);

  }

  ctx.font = font(400, 11); ctx.fillStyle = C.ink2; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i <= 4; i++) { const ms = TOTAL * i / 4; ctx.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center'; ctx.fillText(fmtMs(ms), sx(ms), SY + 46); }

const infraHops = calls.filter((c) => nodes.get(c.to).inferred).length;
function drawFooter() {
  ctx.font = font(400, 12); ctx.fillStyle = C.ink2; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const syn = D.meta && D.meta.synthetic ? 'SYNTHETIC sample data  ·  ' : '';
  ctx.fillText(`${syn}${spans.length} spans  ·  ${calls.length} hops (${infraHops} infrastructure, ${calls.length - infraHops} unmatched: no contract index)  ·  rendered locally by Transit`, 40, 872);
}

window.renderAt = renderAt;
window.VIZ = {

  frameOfTraceMs: (ms) => Math.ceil((INTRO + ms / MS_PER_SEC) * FPS - 1e-6),
  calls: calls.map((c) => ({ from: c.from, to: c.to, start: c.start, end: c.end, slow: c.slow, error: c.error, spanId: c.span.spanId, name: c.span.name, infra: nodes.get(c.to).inferred })),

const q = new URLSearchParams(location.search);
const scrub = document.getElementById('scrub'), btn = document.getElementById('play'), lab = document.getElementById('tlabel');

let T = q.has('t') ? parseFloat(q.get('t')) || 0 : 0, playing = false, last = null;
function show(t) { T = clamp(t, 0, SECONDS); renderAt(T); scrub.value = T; lab.textContent = `${T.toFixed(2)} s / ${SECONDS.toFixed(2)} s  (frame ${Math.round(T * FPS)})`; }
