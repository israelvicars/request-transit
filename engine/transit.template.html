<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit</title>
<!-- Transit: self-contained subway-map view of one trace. No network. Every frame is a pure
     function of t via window.renderAt(t): no Date.now, no timers, no randomness. -->
<style>
  /*__FONTS__*/
  html, body { margin: 0; background: #FFFFFF; }
  body { font-family: "Transit Sans", Arial, sans-serif; color: #111; }
  #stage { display: block; width: 1200px; height: 900px; }
  #controls { width: 1200px; box-sizing: border-box; padding: 10px 24px 8px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  #controls button { font: inherit; padding: 6px 14px; border: 2px solid #111; background: #fff; border-radius: 18px; cursor: pointer; min-width: 76px; font-weight: 700; }
  #controls input[type=range] { flex: 1; accent-color: #111; }
  #controls .t { font-variant-numeric: tabular-nums; min-width: 190px; text-align: right; color: #555; }
  #hops { width: 1200px; box-sizing: border-box; padding: 4px 24px 24px; font-size: 13px; }
  #hops table { border-collapse: collapse; width: 100%; }
  #hops td, #hops th { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; }
  #wrap { display: flex; align-items: flex-start; }
  #main { width: 1200px; flex: none; }
  #panel { width: 380px; flex: none; box-sizing: border-box; height: 900px; overflow: auto; border-left: 2px solid #111; padding: 0 18px 24px; font-size: 13px; position: sticky; top: 0; }
  #panel .hdr { display: flex; justify-content: space-between; align-items: center; background: #111; color: #fff; margin: 0 -18px 12px; padding: 10px 18px; font-weight: 700; letter-spacing: .04em; }
  #panel .hdr button { background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; }
  #panel h2 { font-size: 18px; margin: 6px 0 10px; word-break: break-word; }
  #panel h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #4A4A4A; margin: 18px 0 6px; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel th { text-align: left; color: #4A4A4A; font-weight: 400; padding: 3px 8px 3px 0; vertical-align: top; white-space: nowrap; }
  #panel td { padding: 3px 0; word-break: break-word; }
  #panel table.attrs th { white-space: normal; word-break: break-all; font-family: ui-monospace, monospace; font-size: 11px; width: 45%; }
  #panel ul { margin: 0; padding: 0; list-style: none; }
  #panel a { color: #111; text-decoration: none; display: block; padding: 3px 0; }
  #panel a:hover { text-decoration: underline; }
  #panel .dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; }
  #panel .route { color: #4A4A4A; }
  #panel .muted { color: #9A9A9A; margin: 4px 0; }
  #panel .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: #E7E7E7; }
  #panel .tag.err { background: #D42A1E; color: #fff; } #panel .tag.slow { background: #E89A00; }
  #panel .contract { border: 2px dashed #9A9A9A; padding: 10px; color: #4A4A4A; border-radius: 6px; }
  #panel .empty { padding-top: 40px; color: #4A4A4A; }
  kbd { font: 700 11px ui-monospace, monospace; border: 1px solid #111; border-radius: 4px; padding: 1px 5px; background: #fff; }
  #speed { display: flex; gap: 0; } #speed button { min-width: 0; border-radius: 0; padding: 6px 10px; margin-left: -2px; }
  #speed button:first-child { border-radius: 18px 0 0 18px; } #speed button:last-child { border-radius: 0 18px 18px 0; }
  #speed button.on { background: #111; color: #fff; }
  #help { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #help[hidden] { display: none; }
  #help div { background: #fff; padding: 22px 30px; border-radius: 8px; min-width: 380px; }
  #help td { padding: 4px 14px 4px 0; }
  .render #controls, .render #hops, .render #panel, .render #help { display: none !important; }
</style>
</head>
<body>
<div id="wrap"><div id="main">
<canvas id="stage" width="1200" height="900"></canvas>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0">
  <span id="speed"><button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button></span>
  <span class="t" id="tlabel"></span>
</div>
<div id="hops"></div>
</div><aside id="panel"></aside></div>
<div id="help" hidden><div><h3>Keyboard shortcuts</h3><table>
<tr><td><kbd>Space</kbd></td><td>play / pause</td></tr>
<tr><td><kbd>N</kbd> <kbd>↓</kbd> <kbd>Shift</kbd>+<kbd>→</kbd></td><td>next hop</td></tr>
<tr><td><kbd>P</kbd> <kbd>↑</kbd> <kbd>Shift</kbd>+<kbd>←</kbd></td><td>previous hop</td></tr>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>seek 0.5 s</td></tr>
<tr><td><kbd>,</kbd> <kbd>.</kbd></td><td>step one frame</td></tr>
<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>start / end</td></tr>
<tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>speed 0.5x / 1x / 2x</td></tr>
<tr><td>click</td><td>station, train or line: select that hop</td></tr>
<tr><td>pause</td><td>selects the hop in progress</td></tr>
<tr><td><kbd>Esc</kbd></td><td>deselect / close</td></tr>
<tr><td><kbd>?</kbd></td><td>this help</td></tr></table></div></div>
<script>
/*__TRACE_DATA__*/
</script>
<script>

  else i = dir > 0 ? hops.findIndex((c) => c.start > tm - 1e-9) : hops.map((c) => c.start < tm).lastIndexOf(true);
  if (i < 0) i = dir > 0 ? 0 : hops.length - 1;
  selectHop(hops[clamp(i, 0, hops.length - 1)]);
}
panel.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-span]');
  if (a) { ev.preventDefault(); select(byId.get(a.dataset.span)); return; }
  if (ev.target.id === 'pclose') select(null, false);
});
// ---- canvas hit testing (in CSS px of the 1200x900 stage)
function hitTest(x, y) {
  const tm = traceMsAt(T);
  // trains first: they sit on top
  for (const tr of calls.map((c) => trainFor(c, tm)).filter(Boolean)) {
    const p = at(tr.e.path, tr.p * tr.e.path.len);
    if (Math.hypot(p.x - x, p.y - y) < 16) return { type: 'train', call: tr.c };
  }
  for (const n of order) {
    if (x > n.x - 16 && x < n.x + 16 && y > n.y + n.top - 16 && y < n.y + n.bot + 16) return { type: 'station', node: n };
    const ly = n.y + n.top - 19;
    if (Math.abs(x - n.x) < 80 && y > ly - 16 && y < ly + 4) return { type: 'station', node: n };
  }
  // strip hop ticks
  if (y > SY - 40 && y < SY + 30) {
    let best = null, bd = 8;
    for (const c of hops) { const d = Math.abs(sx(c.start) - x); if (d < bd) { bd = d; best = c; } }
    if (best) return { type: 'strip', call: best };
  }
  // line segments
  let best = null, bd = 9;
  for (const e of edges.values()) for (const pt of e.path.pts) { const d = Math.hypot(pt[0] - x, pt[1] - y); if (d < bd) { bd = d; best = e; } }
  if (best) {
    const cs = best.calls.slice().sort((a, b) => a.start - b.start);
    const c = cs.find((k) => tm >= k.start && tm < k.end) || cs.find((k) => k.start >= tm) || cs[0];
    return { type: 'segment', call: c };
  }
  return null;
}
function onCanvasClick(ev) {
  const r = cv.getBoundingClientRect();
  const h = hitTest((ev.clientX - r.left) * STAGE.width / r.width, (ev.clientY - r.top) * STAGE.height / r.height);
  if (!h) { setPlaying(!playing, true); return; }
  if (h.call) return selectHop(h.call);
  const n = h.node, tm = traceMsAt(T);
  if (n.id === root.service && !hops.some((c) => c.to === n.id)) return select(root);
  const arr = hops.filter((c) => c.to === n.id);
  if (!arr.length) return select(spans.find((s) => nodeOf(s) === n.id) || root);
  selectHop(arr.find((c) => c.start >= tm - 1e-9 && hopOfSpan(sel) !== c) || arr[0]);
}
cv.addEventListener('click', onCanvasClick);
cv.addEventListener('mousemove', (ev) => {
  const r = cv.getBoundingClientRect();
  cv.style.cursor = hitTest((ev.clientX - r.left) * STAGE.width / r.width, (ev.clientY - r.top) * STAGE.height / r.height) ? 'pointer' : 'default';
});
btn.onclick = () => setPlaying(!playing, true);
scrub.oninput = () => { setPlaying(false); show(parseFloat(scrub.value)); };
document.querySelectorAll('#speed button').forEach((b) => { b.onclick = () => setSpeed(Number(b.dataset.s)); });
const help = $('help');
const toggleHelp = (v) => { help.hidden = v === undefined ? !help.hidden : !v; };
help.addEventListener('click', () => toggleHelp(false));
addEventListener('keydown', (ev) => {
  if (RENDER || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) && ev.target.type !== 'range') return;
  const k = ev.key;
  let handled = true;
  if (k === '?' || (k === '/' && ev.shiftKey)) toggleHelp();
  else if (k === 'Escape') { if (!help.hidden) toggleHelp(false); else select(null, false); }
  else if (ev.code === 'Space') setPlaying(!playing, true);
  else if (k === 'n' || k === 'N' || k === 'ArrowDown' || (ev.shiftKey && k === 'ArrowRight')) stepHop(1);
  else if (k === 'p' || k === 'P' || k === 'ArrowUp' || (ev.shiftKey && k === 'ArrowLeft')) stepHop(-1);
  else if (k === 'ArrowRight') { setPlaying(false); show(T + 0.5); }
  else if (k === 'ArrowLeft') { setPlaying(false); show(T - 0.5); }
  else if (k === '.') { setPlaying(false); show(Math.round(T * FPS + 1) / FPS); }
  else if (k === ',') { setPlaying(false); show(Math.round(T * FPS - 1) / FPS); }
  else if (k === 'Home') { setPlaying(false); show(0); }
  else if (k === 'End') { setPlaying(false); show(SECONDS - 1 / FPS); }
  else if (k === '1') setSpeed(0.5);
  else if (k === '2') setSpeed(1);
  else if (k === '3') setSpeed(2);
  else handled = false;
  if (handled) ev.preventDefault();
});
// test hook for the Playwright interaction tests
window.TRANSIT_UI = {
  state: () => ({ t: T, playing, speed: SPEED, selected: sel && sel.spanId, hop: sel && hopOfSpan(sel) ? hops.indexOf(hopOfSpan(sel)) : -1, help: !help.hidden }),
  hops: hops.map((c) => ({ spanId: c.span.spanId, from: c.from, to: c.to, start: c.start, t: tOfMs(c.start) })),
  stations: order.map((n) => ({ id: n.id, x: n.x, y: n.y })),
  trainPoints: () => calls.map((c) => trainFor(c, traceMsAt(T))).filter(Boolean).map((r) => { const p = at(r.e.path, r.p * r.e.path.len); return { x: p.x, y: p.y, spanId: r.c.span.spanId }; }),
  edgePoint: (i) => { const c = hops[i], e = edgeOf(c), p = e.path.pts[Math.floor(e.path.pts.length / 2)]; return { x: p[0], y: p[1] }; },
};
const want = !RENDER && (q.get('span') || q.get('pin') || (location.hash.match(/span=([^&]+)/) || [])[1]);
renderPanel();
if (want && byId.has(decodeURIComponent(want))) select(byId.get(decodeURIComponent(want)), !q.has('t'));
else show(T);
if (document.fonts) document.fonts.ready.then(() => show(T));
if (!RENDER && !q.has('t') && !q.has('paused') && !want) setPlaying(true);
})();
